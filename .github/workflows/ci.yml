name: Rust CI

on:
  pull_request:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        if: matrix.job != 'fmt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxcomposite-dev \
            libxdamage-dev libxfixes-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        if: matrix.job != 'fmt'

      - name: cargo fmt (check)
        if: matrix.job == 'fmt'
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        if: matrix.job == 'clippy'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        if: matrix.job == 'test'
        run: cargo test --locked --all-features

      - name: Install display test dependencies
        if: matrix.job == 'test'
        run: sudo apt-get install -y --no-install-recommends xvfb xauth fonts-dejavu-core

      - name: Build display tests
        if: matrix.job == 'test'
        run: cargo test --locked --all-features --no-run

      - name: Display regressions on isolated Xvfb
        if: matrix.job == 'test'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp -noreset" \
            env EPM_X11_TESTS=1 timeout 180s \
            cargo test --locked --all-features -- --ignored --test-threads=1

  nix:
    name: Nix build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake check --no-update-lock-file --print-build-logs
