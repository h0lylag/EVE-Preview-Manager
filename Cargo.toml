[package]
name = "eve-preview-manager"
version = "1.8.0"
edition = "2024"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
x11rb = { version = "0.14.0", features = ["composite", "damage", "render", "tracing"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "6.0.0"
evdev = "0.13.2"
fontdue = "0.9.3"
fontconfig = "0.11.0"
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2.189"

eframe = { version = "0.35.0", default-features = false, features = ["glow", "x11"] }
egui = "0.35.0"
ipc-channel = "0.22.0"
ksni = "0.3.6"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "signal"] }
png = "0.18.1"
chrono = "0.4.45"
flate2 = "1.1.9"
tar = "0.4.46"
tempfile = "3.27.0"
